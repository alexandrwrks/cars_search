services:
  api:
    container_name: cars_api
    build: .
    ports:
     - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: